<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Stream Inspector: a play symbol (the replayed stream) circled by the orbit of a LEO
       satellite, on a night sky. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a7d"/>
      <stop offset="1" stop-color="#060b1c"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64d2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#64d2ff"/>
    </linearGradient>
    <!-- The half of the orbit nearer the viewer: everything below the orbit's long axis. -->
    <clipPath id="front">
      <rect x="-600" y="0" width="1200" height="400" transform="translate(512 512) rotate(-22)"/>
    </clipPath>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 px rounded square centred on the 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff"
        stroke-opacity="0.08" stroke-width="3"/>
  <!-- Stars. -->
  <g fill="#ffffff">
    <circle cx="246" cy="236" r="6" opacity="0.6"/>
    <circle cx="772" cy="214" r="5" opacity="0.5"/>
    <circle cx="842" cy="742" r="6" opacity="0.4"/>
    <circle cx="214" cy="790" r="5" opacity="0.5"/>
    <circle cx="352" cy="164" r="4" opacity="0.35"/>
    <circle cx="660" cy="852" r="4" opacity="0.35"/>
  </g>
  <!-- The far half of the orbit, behind the play symbol. -->
  <ellipse cx="512" cy="512" rx="350" ry="112" transform="rotate(-22 512 512)" fill="none"
           stroke="#64d2ff" stroke-opacity="0.3" stroke-width="18"/>
  <!-- Play symbol with rounded corners. -->
  <path d="M392 318 Q392 270 434 294 L708 466 Q748 491 708 516 L434 688 Q392 712 392 664 Z"
        fill="url(#play)" filter="url(#shadow)"/>
  <!-- The near half of the orbit, in front of it. -->
  <ellipse cx="512" cy="512" rx="350" ry="112" transform="rotate(-22 512 512)" fill="none"
           stroke="url(#orbit)" stroke-width="18" clip-path="url(#front)"/>
  <!-- The satellite, on the near half of the orbit. -->
  <g transform="translate(787 478) rotate(-30) scale(0.74)" filter="url(#shadow)">
    <rect x="-30" y="-36" width="60" height="72" rx="12" fill="#f2f2f7"/>
    <rect x="-118" y="-26" width="74" height="52" rx="7" fill="#0a84ff"/>
    <rect x="44" y="-26" width="74" height="52" rx="7" fill="#0a84ff"/>
    <path d="M-44 0h14M30 0h14" stroke="#f2f2f7" stroke-width="10"/>
    <path d="M-81 -26v52M81 -26v52" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5"/>
    <circle cx="0" cy="44" r="10" fill="#f2f2f7"/>
  </g>
</svg>
