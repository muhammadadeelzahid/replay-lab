<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Stream Inspector: a play symbol (the replayed stream) sent down from a LEO satellite,
       under a magnifying glass showing the stepped line of the bitrate the player switched
       between. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c45"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="612" cy="604" r="128"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 px rounded square centred on the 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- Play symbol with rounded corners. -->
  <path d="M276 236 Q276 186 320 211 L662 404 Q706 429 662 454 L320 647 Q276 672 276 622 Z"
        fill="url(#play)" filter="url(#shadow)"/>
  <!-- A LEO satellite overhead, beaming the stream down: the backhaul. -->
  <path d="M688 350 A90 90 0 0 1 630 281" fill="none" stroke="#64d2ff" stroke-width="18"
        stroke-linecap="round" stroke-opacity="0.95"/>
  <path d="M672 394 A135 135 0 0 1 585 290" fill="none" stroke="#64d2ff" stroke-width="18"
        stroke-linecap="round" stroke-opacity="0.55"/>
  <g transform="translate(716 266) rotate(-40) scale(0.8)" filter="url(#shadow)">
    <rect x="-30" y="-36" width="60" height="72" rx="12" fill="#f2f2f7"/>
    <rect x="-118" y="-26" width="74" height="52" rx="7" fill="#0a84ff"/>
    <rect x="44" y="-26" width="74" height="52" rx="7" fill="#0a84ff"/>
    <path d="M-44 0h14M30 0h14" stroke="#f2f2f7" stroke-width="10"/>
    <path d="M-81 -26v52M81 -26v52" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5"/>
    <circle cx="0" cy="44" r="10" fill="#f2f2f7"/>
  </g>
  <!-- Magnifying glass. -->
  <g filter="url(#shadow)">
    <line x1="712" y1="704" x2="812" y2="804" stroke="#f2f2f7" stroke-width="60" stroke-linecap="round"/>
    <circle cx="612" cy="604" r="150" fill="url(#glass)" stroke="#f2f2f7" stroke-width="44"/>
  </g>
  <!-- The bitrate the player stepped between, seen through the lens. -->
  <g clip-path="url(#lens)">
    <path d="M500 668 H548 V626 H596 V586 H644 V546 H724" fill="none" stroke="#30d158"
          stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
