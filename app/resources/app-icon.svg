<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="1" stop-color="#2d4fe0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px rounded square centred on a 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- The screen: the replayed stream. -->
  <g filter="url(#shadow)">
    <rect x="212" y="236" width="600" height="440" rx="56" fill="url(#screen)"/>
  </g>
  <!-- The bitrate ladder the player climbed, one bar per rung. -->
  <rect x="278" y="530" width="70" height="88" rx="16" fill="#34c759"/>
  <rect x="372" y="470" width="70" height="148" rx="16" fill="#30b0c7"/>
  <rect x="466" y="404" width="70" height="214" rx="16" fill="#007aff"/>
  <rect x="560" y="340" width="70" height="278" rx="16" fill="#5856d6"/>
  <rect x="654" y="294" width="70" height="324" rx="16" fill="#af52de"/>
  <!-- Stand. -->
  <rect x="452" y="676" width="120" height="70" fill="#dfe6f3"/>
  <rect x="352" y="740" width="320" height="40" rx="20" fill="#ffffff"/>
</svg>
