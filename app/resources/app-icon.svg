<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ReplayLab: a play symbol over a video frame split in two, one half sharp and one
       half soft, as two ABR algorithms are compared side by side. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#e9532f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="212" y="282" width="600" height="460" rx="56"/>
    </clipPath>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 px rounded square centred on the 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff"
        stroke-opacity="0.08" stroke-width="3"/>
  <!-- The frame: a landscape of hills under a sky, sharp on the left, soft on the right. -->
  <g clip-path="url(#frame)">
    <rect x="212" y="282" width="600" height="460" fill="#4a4a52"/>
    <g clip-path="url(#left)">
      <rect x="212" y="282" width="600" height="460" fill="#5b5b66"/>
      <circle cx="330" cy="380" r="40" fill="#d8d8de"/>
      <path d="M212 640 L340 520 L440 600 L560 470 L700 610 L812 540 L812 742 L212 742 Z" fill="#2c2c32"/>
      <path d="M212 700 L360 620 L500 690 L640 610 L812 680 L812 742 L212 742 Z" fill="#1f1f24"/>
    </g>
    <g clip-path="url(#right)">
      <g filter="url(#blur)">
        <rect x="200" y="270" width="624" height="484" fill="#5b5b66"/>
        <path d="M212 640 L340 520 L440 600 L560 470 L700 610 L812 540 L812 760 L212 760 Z" fill="#2c2c32"/>
        <path d="M212 700 L360 620 L500 690 L640 610 L812 680 L812 760 L212 760 Z" fill="#1f1f24"/>
      </g>
    </g>
  </g>
  <rect x="212" y="282" width="600" height="460" rx="56" fill="none" stroke="#ffffff"
        stroke-opacity="0.18" stroke-width="6"/>
  <!-- The divider. -->
  <rect x="505" y="252" width="14" height="520" rx="7" fill="#ffffff"/>
  <!-- Play symbol with rounded corners. -->
  <path d="M430 400 Q430 366 460 384 L630 486 Q658 503 630 520 L460 622 Q430 640 430 606 Z"
        fill="url(#play)" filter="url(#shadow)"/>
</svg>
