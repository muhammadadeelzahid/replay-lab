<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2b53"/>
      <stop offset="1" stop-color="#0d5f73"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- The bitrate ladder: one bar per rung, coloured as in the timeline. -->
  <rect x="236" y="676" width="92" height="136" rx="18" fill="#6a55b0"/>
  <rect x="352" y="600" width="92" height="212" rx="18" fill="#3f7fc0"/>
  <rect x="468" y="512" width="92" height="300" rx="18" fill="#26a69a"/>
  <rect x="584" y="410" width="92" height="402" rx="18" fill="#5cc96b"/>
  <rect x="700" y="292" width="92" height="520" rx="18" fill="#f4d43a"/>
  <!-- The buffer level drawn across the ladder. -->
  <path d="M212 612 C 330 560, 410 640, 520 470 S 700 330, 812 250" fill="none"
        stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Play button. -->
  <circle cx="330" cy="330" r="118" fill="#ffffff"/>
  <path d="M296 266 L296 394 L404 330 Z" fill="#163a5c" stroke="#163a5c" stroke-width="14"
        stroke-linejoin="round"/>
</svg>
